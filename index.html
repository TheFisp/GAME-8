<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Quiz</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --success-green: #2ecc71;
            --error-red: #e74c3c;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.4s;
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            background: rgba(0,0,0,0.6);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 20px 50px;
            font-size: 1.5rem;
            cursor: pointer;
            background: white;
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        #reveal-btn { display: none; z-index: 101; }

        #game-container { text-align: center; width: 90%; max-width: 700px; z-index: 10; }
        #quiz-section { display: none; }
        
        .quote-text { font-size: 2.2rem; margin-bottom: 30px; font-weight: 800; min-height: 100px; text-transform: uppercase; }
        input { padding: 15px; font-size: 1.3rem; width: 100%; max-width: 400px; text-align: center; background: transparent; border: 3px solid white; color: white; outline: none; }

        #win-section {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            text-align: center;
            width: 100%;
        }

        .win-title {
            font-size: 5rem; color: #FFD700;
            margin: 0; font-weight: 900;
            animation: sway 2.5s ease-in-out infinite;
        }

        .win-subtitle { font-style: italic; margin-top: 25px; font-size: 1.3rem; opacity: 0.9; padding: 0 30px; }

        @keyframes sway {
            0%, 100% { transform: translateX(-25px) rotate(-1.5deg); }
            50% { transform: translateX(25px) rotate(1.5deg); }
        }

        canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 150; }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div id="overlay">
        <button id="start-btn">INIZIA</button>
        <button id="reveal-btn">RIVELA IL FINALE</button>
    </div>

    <div id="game-container">
        <div id="quiz-section">
            <div id="quote-display" class="quote-text"></div>
            <input type="text" id="answer-input" placeholder="SCRIVI IL NOME..." autocomplete="off">
        </div>
    </div>

    <div id="win-section">
        <h1 class="win-title">HAI VINTO</h1>
        <p class="win-subtitle">I wish I could stay in this moment forever. (...) But then it wouldn't be a moment.</p>
    </div>

    <script>
        // Configurazione citazioni
        const quotes = [
            { text: "DEDICATE I VOSTRI CUORI", author: "Erwin Smith" },
            { text: "Non confondere la mia calma con debolezza", author: "Kratos" },
            { text: "Il lavoro è una merda", author: "Nanami" },
            { text: "Gli umani non sono altro che scimmie.", author: "Suguru Geto" },
            { text: "Ryūjin no ken wo kurae", author: "Genji" },
            { text: "You’re gonna have a bad time.", author: "Sans" },
            { text: "Power comes to those who take it.", author: "Silco" }
        ];

        let currentIndex = 0;

        // --- GESTIONE AUDIO ---
        const audio = new Audio("vittoria.mp3");
        audio.preload = "auto";

        // Elementi DOM
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const revealBtn = document.getElementById('reveal-btn');
        const quizSection = document.getElementById('quiz-section');
        const quoteDisplay = document.getElementById('quote-display');
        const answerInput = document.getElementById('answer-input');
        const winSection = document.getElementById('win-section');

        // Tasto INIZIA
        startBtn.onclick = function() {
            overlay.style.display = 'none';
            startBtn.style.display = 'none';
            quizSection.style.display = 'block';
            answerInput.focus();
            showQuote();
        };

        function showQuote() {
            if (currentIndex < quotes.length) {
                quoteDisplay.textContent = quotes[currentIndex].text;
                answerInput.value = "";
                document.body.style.backgroundColor = "var(--bg-color)";
            }
        }

        answerInput.onkeypress = function(e) {
            if (e.key === 'Enter') {
                const ans = answerInput.value.trim().toLowerCase();
                const target = quotes[currentIndex].author.toLowerCase();

                if (ans === target) {
                    document.body.style.backgroundColor = "var(--success-green)";
                    currentIndex++;
                    if (currentIndex >= quotes.length) {
                        prepareFinalStep();
                    } else {
                        setTimeout(showQuote, 500);
                    }
                } else {
                    document.body.style.backgroundColor = "var(--error-red)";
                    quoteDisplay.textContent = "";
                    setTimeout(() => {
                        quoteDisplay.textContent = quotes[currentIndex].text;
                        document.body.style.backgroundColor = "var(--bg-color)";
                        answerInput.value = "";
                    }, 600);
                }
            }
        };

        function prepareFinalStep() {
            quizSection.style.display = 'none';
            overlay.style.display = 'flex';
            overlay.style.background = "rgba(0,0,0,0.85)";
            revealBtn.style.display = 'block';
        }

        // Tasto RIVELA IL FINALE
        revealBtn.onclick = function() {
            revealBtn.style.display = 'none';
            winSection.style.display = 'block';
            
            // Prova a far partire l'audio, se fallisce scrive l'errore in console ma non blocca il resto
            audio.play().catch(err => {
                console.log("Audio non trovato o bloccato, ma il gioco continua!");
            });
            
            startConfetti();
        };

        // Funzione Coriandoli
        function startConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            let particles = Array.from({length:150}, () => ({
                x: Math.random()*canvas.width, y: -20, 
                r: Math.random()*6+4, c: `hsl(${Math.random()*360}, 80%, 60%)`,
                s: Math.random()*3+2, t: Math.random()*10
            }));
            function draw() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                particles.forEach(p => {
                    p.y += p.s; p.t += 0.1;
                    if(p.y > canvas.height) p.y = -20;
                    ctx.fillStyle = p.c; ctx.beginPath();
                    ctx.arc(p.x + Math.sin(p.t)*10, p.y, p.r, 0, 7); ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        }
    </script>
</body>
</html>
